<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        /* =========================
           GÉNÉRAL
           ========================= */

        body {
            background: #dbd4cc;
            margin: 0;
            padding: 0;
        }


        /* =========================
           HEADER
           ========================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            height: 15vh;

            background: #0f3b59;
            border-radius: 0 0 10px 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 10;
        }

        header h1 {
            margin: 0;
            color: #F7FEEB;
        }


        /* =========================
           BOUTON SCHOOL
           ========================= */

        .bouton-school {
            position: absolute;
            left: 20px;

            background: #3e251e;
            border-radius: 8px;

            padding: 8px 15px;

            cursor: pointer;
            user-select: none;
        }

        .bouton-school p {
            margin: 0;
            color: #dbd4cc;
        }


        /* =========================
           BOUTON ACCÈS
           ========================= */

        .bouton-acces {
            position: absolute;
            right: 20px;

            background: #3e251e;
            border-radius: 8px;

            padding: 8px 15px;

            cursor: pointer;
            user-select: none;
        }

        .bouton-acces p {
            margin: 0;
            color: #dbd4cc;
        }


        /* =========================
           CARTES DES JEUX
           ========================= */

        .cartes {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;

            padding-left: 100px;
            padding-top: 18vh;
            padding-bottom: 30px;
        }

        .carte {
            width: 170px;
            aspect-ratio: 10/11;

            background: #dba12c;
            border-radius: 10px;

            padding: 12px;
            box-sizing: border-box;

            display: flex;
            flex-direction: column;
            align-items: center;

            cursor: pointer;
        }

        .carte img {
            width: 100%;
            height: 150px;

            object-fit: cover;
            border-radius: 8px;
        }

        .carte h3 {
            margin: 12px 0 0;
            text-align: center;
            color: #F7FEEB;

            height: 2.5em;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           PAGE SCHOOL
           ========================= */

        #schoolPage {
            display: none;
            min-height: 100vh;
            background: #dbd4cc;
        }


        /* =========================
           BOUTON RETOUR
           ========================= */

        .retour {
            position: absolute;
            left: 20px;

            background: #3e251e;
            border-radius: 8px;

            padding: 8px 15px;

            cursor: pointer;
            user-select: none;
        }

        .retour p {
            margin: 0;
            color: #dbd4cc;
        }

        .english-section h2 {
            display: flex;
            align-items: center;
            gap: 20px;
        }   

        .english-section h2::after {
            content: "";
            flex: 1;
            height: 2px;
            background: #0f3b59;
        }


        /* =========================
           SECTION ENGLISH
           ========================= */

        .english-section {
            max-width: 1000px;

            margin: 0 auto;

            padding-top: calc(15vh + 45px);
            padding-bottom: 60px;
        }

        .english-section h2 {
            margin: 0 0 25px;

            color: #0f3b59;

            font-size: 32px;
        }

        .english-article {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .english-article img {
            width: min(800px, 100%);
            height: auto;

            display: block;

            border-radius: 10px;
        }

        .english-article a {
            margin-top: 15px;

            color: #0f3b59;

            font-size: 18px;
            font-weight: bold;

            text-decoration: none;

            border-bottom: 2px solid #0f3b59;

            padding-bottom: 3px;
        }

        .english-article a:hover {
            opacity: 0.7;
        }


        /* =========================
           RESPONSIVE
           ========================= */

        @media (max-width: 700px) {

            .cartes {
                padding-left: 20px;
                padding-right: 20px;

                justify-content: center;
            }

            .english-section {
                padding-left: 20px;
                padding-right: 20px;
            }

            header h1 {
                font-size: 24px;
            }

            .bouton-school,
            .bouton-acces,
            .retour {
                padding: 7px 10px;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         PAGE PRINCIPALE
         ===================================================== -->

        <header>

            <div class="bouton-school" onclick="openSchool()">

            <div class="bouton-acces" onclick="switchMode()">

    <script>


        /* =================================================
           SÉCURITÉ POUR LES JEUX
           ================================================= */

        if (localStorage.getItem("secure") === null) {

            localStorage.setItem("secure", "null");

        }


        function mdp() {

            const password = "HeaC14N16Kiss";

            const input = prompt("Mot de passe ?");


            if (input === password) {

                localStorage.setItem("secure", "true");

            }

        }



        /* =================================================
           SCHOOL
           ================================================= */

        function openSchool() {

            const password = prompt("Mot de passe School ?");


            if (password === "INDreb3bellion") {

                document.getElementById("mainPage").style.display = "none";

                document.getElementById("schoolPage").style.display = "block";

                window.scrollTo(0, 0);

                alert("Mot de passe incorrect.");

                    dico[bouton][0];

            else {

        }

                    "https://dashboard.render.com/web/srv-d9i018epbkes739rqi7g";

            }

        }



        /* =================================================
           UNO
           ================================================= */

        function Uno() {

            alert("UNO");

        }

    </script>

</body>
